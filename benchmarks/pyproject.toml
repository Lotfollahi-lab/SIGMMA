[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmma-benchmarks"
version = "0.1.0"
description = "Research comparison experiments for SIGMMA"
requires-python = ">=3.11,<3.12"
dependencies = ["sigmma==2.0.0", "torch>=2.3,<2.4", "torchvision>=0.18,<0.19", "timm>=1.0", "einops>=0.8,<0.9"]

[project.optional-dependencies]
retrieval = ["open-clip-torch>=2.24,<3", "transformers>=4.40,<4.58"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
